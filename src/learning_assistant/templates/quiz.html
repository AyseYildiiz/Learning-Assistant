<!DOCTYPE html>
<html lang="{{ language }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t('app_name') }} {{ t('quiz_session_heading') }}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg-start: #f5f8ff;
        --bg-end: #edf3ff;
        --surface: rgba(255, 255, 255, 0.95);
        --surface-strong: #ffffff;
        --text-primary: #10182a;
        --text-secondary: #526179;
        --border: rgba(148, 163, 184, 0.28);
        --accent: #2153d8;
        --accent-strong: #153ca7;
        --accent-soft: rgba(33, 83, 216, 0.12);
        --success: #137245;
        --warning: #ac5b11;
        --shadow: 0 28px 70px rgba(15, 24, 42, 0.18);
        --option-bg: linear-gradient(180deg, #ffffff, #fbfdff);
        --option-bg-hover: linear-gradient(180deg, #ffffff, #f3f7ff);
        --option-text: #0f172a;
        --option-border: rgba(148, 163, 184, 0.32);
        --option-border-hover: rgba(37, 99, 235, 0.35);
        --option-marker-border: rgba(100, 116, 139, 0.65);
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --bg-start: #060b15;
        --bg-end: #0c1323;
        --surface: rgba(18, 25, 41, 0.92);
        --surface-strong: #141d32;
        --text-primary: #f3f6ff;
        --text-secondary: #a8b4cf;
        --border: rgba(132, 151, 191, 0.25);
        --accent: #6f95ff;
        --accent-strong: #86a5ff;
        --accent-soft: rgba(111, 149, 255, 0.16);
        --success: #67d99f;
        --warning: #f6c176;
        --shadow: 0 28px 70px rgba(1, 3, 8, 0.5);
        --option-bg: linear-gradient(180deg, #1a263f, #121c31);
        --option-bg-hover: linear-gradient(180deg, #223255, #192845);
        --option-text: #f3f7ff;
        --option-border: rgba(125, 153, 214, 0.4);
        --option-border-hover: rgba(151, 176, 233, 0.7);
        --option-marker-border: rgba(193, 210, 242, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: inherit;
      }

      body {
        font-family: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
        color: var(--text-primary);
        background:
          radial-gradient(circle at top left, rgba(33, 83, 216, 0.26), transparent 35%),
          radial-gradient(circle at top right, rgba(15, 118, 110, 0.17), transparent 33%),
          linear-gradient(160deg, var(--bg-start), var(--bg-end));
      }

      .theme-toggle {
        border: 1px solid var(--border);
        background: var(--surface-strong);
        color: var(--text-primary);
        border-radius: 999px;
        width: 2.85rem;
        height: 2.85rem;
        padding: 0;
        display: grid;
        place-items: center;
        font-weight: 700;
        cursor: pointer;
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 20;
        box-shadow: 0 8px 18px rgba(15, 24, 42, 0.22);
      }

      .theme-toggle-icon {
        font-size: 1.2rem;
        line-height: 1;
      }

      .page-shell {
        max-width: 820px;
        min-height: 640px;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1.2rem;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
        overflow: hidden;
      }

      .page-frame {
        padding: 20px;
      }

      @media (min-width: 768px) {
        body {
          padding: 3rem;
        }
      }
    </style>
  </head>
  <body>
    {% include "language_switch.html" %}
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="{{ t('toggle_theme') }}" title="{{ t('toggle_theme') }}">
      <span id="theme-toggle-icon" class="theme-toggle-icon">☀</span>
    </button>
    <main class="page-shell">
      <div class="page-frame">
        {% include "quiz_panel.html" %}
      </div>
    </main>
    {% include "chat_widget.html" %}
    <script>
      (function () {
        const key = "studyflow-theme";
        const saved = localStorage.getItem(key);
        if (saved) {
          document.documentElement.setAttribute("data-theme", saved);
        }
        const icon = document.getElementById("theme-toggle-icon");
        const updateIcon = function () {
          const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
          icon.textContent = currentTheme === "dark" ? "☀" : "☾";
        };
        updateIcon();

        document.getElementById("theme-toggle").addEventListener("click", function () {
          const current = document.documentElement.getAttribute("data-theme") || "light";
          const next = current === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          localStorage.setItem(key, next);
          updateIcon();
        });
      })();
    </script>
  </body>
</html>
