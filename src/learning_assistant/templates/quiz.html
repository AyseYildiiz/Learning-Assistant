<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Learning Assistant Quiz</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      :root {
        --bg-start: #07111f;
        --bg-end: #121b2f;
        --surface: rgba(255, 255, 255, 0.92);
        --surface-strong: #ffffff;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --border: rgba(148, 163, 184, 0.22);
        --accent: #2563eb;
        --accent-strong: #1d4ed8;
        --accent-soft: rgba(37, 99, 235, 0.1);
        --success: #15803d;
        --warning: #b45309;
        --shadow: 0 30px 80px rgba(2, 8, 23, 0.38);
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      body {
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
        color: var(--text-primary);
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.28), transparent 30%),
          radial-gradient(circle at top right, rgba(14, 165, 233, 0.18), transparent 28%),
          linear-gradient(160deg, var(--bg-start), var(--bg-end));
      }

      .page-shell {
        max-width: 720px;
        max-height: 600px;
        margin: 0 auto;
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 1.5rem;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        overflow: auto;
        scrollbar-width: none; 
        -ms-overflow-style: none; 
        
      }
      
     

      @media (min-width: 768px) {
        body {
          padding: 3rem;
        }

        
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <div class="page-frame">
        {% include "quiz_panel.html" %}
      </div>
    </main>
  </body>
</html>
