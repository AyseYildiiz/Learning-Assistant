<style>
  .chat-toggle-button {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 0;
    background: #2153d8;
    color: #fff;
    font-size: 1.5rem;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(15, 24, 42, 0.35);
    z-index: 40;
  }
  .chat-toggle-button:hover { background: #183ea9; }

  body {
    transition: margin-right 0.25s ease;
  }
  body.chat-panel-open {
    margin-right: min(380px, 100vw);
  }

  .chat-panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: min(380px, 100vw);
    background: #ffffff;
    color: #16203a;
    border-left: 1px solid #d7deea;
    box-shadow: -18px 0 40px rgba(15, 24, 42, 0.18);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 50;
  }
  .chat-panel.chat-panel--open { transform: translateX(0); }

  [data-theme="dark"] .chat-panel {
    background: #111827;
    color: #ecf1ff;
    border-left-color: #2a3345;
  }

  .chat-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid #d7deea;
  }
  [data-theme="dark"] .chat-panel-header { border-bottom-color: #2a3345; }

  .chat-panel-header strong { font-family: "Space Grotesk", sans-serif; }

  .chat-close-button {
    border: 0;
    background: transparent;
    font-size: 1.1rem;
    cursor: pointer;
    color: inherit;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chat-hint { margin: 0; color: #5e6b84; font-size: .9rem; }
  [data-theme="dark"] .chat-hint { color: #a8b3cc; }

  .chat-message { margin: 0; }
  .chat-message p {
    margin: 0;
    padding: 10px 12px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.4;
    font-size: .92rem;
    white-space: pre-wrap;
  }

  .chat-message--user { display: flex; justify-content: flex-end; }
  .chat-message--user p { background: #2153d8; color: #fff; border-bottom-right-radius: 4px; }

  .chat-message--assistant { display: flex; justify-content: flex-start; }
  .chat-message--assistant p {
    background: #edf2ff;
    color: #16203a;
    border-bottom-left-radius: 4px;
  }
  [data-theme="dark"] .chat-message--assistant p { background: #1a2540; color: #ecf1ff; }

  .chat-message--typing p {
    letter-spacing: 2px;
    animation: chat-typing-pulse 1.2s ease-in-out infinite;
  }

  @keyframes chat-typing-pulse {
    0%, 80%, 100% { opacity: .35; }
    40% { opacity: 1; }
  }

  .chat-form {
    display: flex;
    gap: 8px;
    padding: 14px 16px;
    border-top: 1px solid #d7deea;
  }
  [data-theme="dark"] .chat-form { border-top-color: #2a3345; }

  .chat-form input {
    flex: 1;
    border: 1px solid #d7deea;
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    background: #fff;
    color: inherit;
  }
  [data-theme="dark"] .chat-form input { background: #0d1526; border-color: #2a3345; }

  .chat-form button {
    border: 0;
    background: #2153d8;
    color: #fff;
    border-radius: 10px;
    padding: 10px 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .chat-form button:hover { background: #183ea9; }
  .chat-form button:disabled { opacity: .6; cursor: progress; }

  @media (max-width: 520px) {
    .chat-panel { width: 100vw; }
    body.chat-panel-open { margin-right: 0; }
  }
</style>

<button type="button" id="chat-toggle-button" class="chat-toggle-button" aria-label="{{ t('chat_toggle_label') }}" title="{{ t('chat_toggle_label') }}">💬</button>

<aside id="chat-panel" class="chat-panel" aria-hidden="true">
  <header class="chat-panel-header">
    <strong>{{ t('chat_toggle_label') }}</strong>
    <button type="button" id="chat-close-button" class="chat-close-button" aria-label="{{ t('chat_close_label') }}">✕</button>
  </header>
  <div id="chat-messages" class="chat-messages">
    {% if chat_history %}
      {% for entry in chat_history %}
        <div class="chat-message chat-message--{{ 'user' if entry.role == 'user' else 'assistant' }}">
          <p>{{ entry.content }}</p>
        </div>
      {% endfor %}
    {% else %}
      <p class="chat-hint">{{ t('chat_hint', name=display_name) }}</p>
    {% endif %}
  </div>
  <form id="chat-form" class="chat-form" data-chat-url="/chat/{{ pdf_id | urlencode }}" data-error-text="{{ t('chat_error_generic') }}">
    <input type="text" id="chat-message-input" name="message" placeholder="{{ t('chat_input_placeholder') }}" autocomplete="off" required maxlength="2000">
    <button id="chat-send-button" type="submit">{{ t('chat_send_button') }}</button>
  </form>
</aside>

<script>
  (function () {
    const toggleButton = document.getElementById("chat-toggle-button");
    const panel = document.getElementById("chat-panel");
    const closeButton = document.getElementById("chat-close-button");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-message-input");

    function openPanel() {
      panel.classList.add("chat-panel--open");
      panel.setAttribute("aria-hidden", "false");
      document.body.classList.add("chat-panel-open");
      input.focus();
    }

    function closePanel() {
      panel.classList.remove("chat-panel--open");
      panel.setAttribute("aria-hidden", "true");
      document.body.classList.remove("chat-panel-open");
    }

    toggleButton.addEventListener("click", function () {
      if (panel.classList.contains("chat-panel--open")) {
        closePanel();
      } else {
        openPanel();
      }
    });
    closeButton.addEventListener("click", closePanel);

    const messages = document.getElementById("chat-messages");
    const sendButton = document.getElementById("chat-send-button");

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function appendUserMessage(text) {
      const wrapper = document.createElement("div");
      wrapper.className = "chat-message chat-message--user";
      const paragraph = document.createElement("p");
      paragraph.textContent = text;
      wrapper.appendChild(paragraph);
      messages.appendChild(wrapper);
      scrollToBottom();
    }

    function appendTypingIndicator() {
      const wrapper = document.createElement("div");
      wrapper.className = "chat-message chat-message--assistant chat-message--typing";
      wrapper.innerHTML = "<p>...</p>";
      messages.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    // Jump to the latest message so restored history isn't shown mid-scroll.
    scrollToBottom();

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        return;
      }

      appendUserMessage(text);
      const typingIndicator = appendTypingIndicator();
      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;

      const body = new URLSearchParams();
      body.set("message", text);

      fetch(form.dataset.chatUrl, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString(),
      })
        .then(function (response) {
          if (!response.ok) {
            throw new Error("Request failed");
          }
          return response.text();
        })
        .then(function (html) {
          typingIndicator.outerHTML = html;
        })
        .catch(function () {
          typingIndicator.classList.remove("chat-message--typing");
          typingIndicator.querySelector("p").textContent = form.dataset.errorText;
        })
        .finally(function () {
          input.disabled = false;
          sendButton.disabled = false;
          input.focus();
        });
    });
  })();
</script>
