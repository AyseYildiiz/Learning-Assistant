<!DOCTYPE html>
<html lang="{{ language }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t('auth_signup_heading') }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --ink: #1b2231;
        --muted: #5e6b84;
        --line: #d7deea;
        --primary: #1d4ed8;
        --surface: #ffffff;
        --canvas: #eef2f9;
        --success: #11653b;
        --danger: #b42318;
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --ink: #ecf1ff;
        --muted: #a8b3cc;
        --line: #2a3345;
        --primary: #5f86ff;
        --surface: #111827;
        --canvas: #070b13;
        --success: #5bd497;
        --danger: #ff9e9e;
      }

      body { font: 16px/1.5 "Source Sans 3", sans-serif; margin: 0; padding: 32px; background: var(--canvas); color: var(--ink); }
      .card { max-width: 520px; margin: 64px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
      label { display: block; margin: 12px 0 6px; font-weight: 600 }
      input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
      .controls { display: flex; gap: 8px; margin-top: 14px }
      .controls button { padding: 10px 14px; border-radius: 8px; border: 0; background: var(--primary); color: #fff; font-weight: 700 }
      .hint { color: var(--muted); margin-top: 8px }
      .message { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px }
      .message.error { background: #fff0ef; color: var(--danger) }
      .message.success { background: #eaf8f0; color: var(--success) }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>{{ t('auth_signup_heading') }}</h1>
      {% if error_message %}<p class="message error" role="alert">{{ error_message }}</p>{% endif %}
      <form method="post" action="/signup">
        <label for="username">{{ t('auth_username_label') }}</label>
        <input id="username" name="username" type="text" required autofocus />

        <label for="password">{{ t('auth_password_label') }}</label>
        <input id="password" name="password" type="password" required autocomplete="new-password" />

        <label for="confirm-password">{{ t('auth_confirm_password_label') }}</label>
        <input id="confirm-password" name="confirm_password" type="password" required autocomplete="new-password" />

        <p class="hint">{{ t('auth_signup_password_hint') }}</p>

        <div class="controls">
          <button type="submit">{{ t('auth_signup_submit') }}</button>
        </div>
      </form>
      <p class="hint">{{ t('auth_signup_has_account') }} <a href="/login">{{ t('auth_signup_login_link') }}</a></p>
    </main>
  </body>
</html>
